# config/services.yaml
services:
    _defaults:
        autowire: true          # Automatically injects dependencies in your services.
        autoconfigure: true     # Automatically registers your services as commands, event subscribers, etc.
        public: false           # Allows optimizing the container by removing unused services; this also means
                                # fetching services directly from the container via $container->get() won't work.
                                # The best practice is to be explicit about your dependencies anyway.
        bind:
            #$projectDir: '%kernel.project_dir%'

    _instanceof:
        PbdKn\ContaoContaohabBundle\Service\Sensors\SensorFetcherInterface:
            tags: ['sensor.fetcher']


    PbdKn\ContaoContaohabBundle\:
        resource: '../../../src/'
        exclude: '../../{DependencyInjection,Resources,public,Tests,Service/Sensors/RaspberryExecScripts,Service/Sensors/AmpereStorageProModbus.php}'

    PbdKn\ContaoContaohabBundle\Controller\:
        resource: '../../Controller/'
        public: true
        tags: ['controller.service_arguments']

    PbdKn\ContaoContaohabBundle\Controller\ImportCohSensorController:
        tags: ['controller.service_arguments']

# eventlistener
    PbdKn\ContaoContaohabBundle\EventListener\BackendStyleListener:
        tags:
          - { name: kernel.event_listener, event: contao.backend.load_data_container, method: __invoke }

# logger service logAusschriebe, nur wenn debug modus
    PbdKn\ContaoContaohabBundle\Service\LoggerService:
        public: true
        arguments:
          $dateiname: 'cohdebug.log'
          $contaoLogger: '@monolog.logger.contao'
          $container: '@service_container' # Injiziere den service_container


#    PbdKn\ContaoContaohabBundle\Command\SyncSensorDataCommand:
#        arguments:
#           $syncService: '@PbdKn\ContaoContaohabBundle\Service\SyncService'
#        tags: ['console.command']

    PbdKn\ContaoContaohabBundle\Service\Sensors\SensorManager:
        arguments:
          $fetchers: !tagged_iterator sensor.fetcher
    PbdKn\ContaoContaohabBundle\Service\Sensors\IQBoxSensorService:
        arguments:
          $httpClient: '@http_client'

    PbdKn\ContaoContaohabBundle\Service\Sensors\IQBoxSensorServiceCloud:
        arguments:
          $ampereClParamsFile: '%coh_sensors.ampere_iq_cl_params_file%'
          $ampereClUsername: '%coh_sensors.ampere_iq_cl_username%'
          $ampereClPassword: '%coh_sensors.ampere_iq_cl_password%'
          $ampereClRetries: '%coh_sensors.ampere_iq_cl_retries%'
          $ampereClRetryDelay: '%coh_sensors.ampere_iq_cl_retry_delay%'
          $ampereClLifetimeCacheSeconds: '%coh_sensors.ampere_iq_cl_lifetime_cache_seconds%'